name: Database Migrations

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'packages/api/drizzle/**'
      # Feature-control seeding runs in this workflow too, so a change to the
      # seed script or to the flag list it reads must trigger it. Without these,
      # adding a feature flag would leave its control rows unseeded until some
      # unrelated migration happened to run.
      - 'packages/api/src/db/seed-feature-controls.ts'
      - 'packages/config/src/config.ts'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "yes" to confirm migration'
        required: true
        default: 'no'

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Only proceed if confirmation is given for manual runs
    if: github.event_name != 'workflow_dispatch' || inputs.confirm == 'yes'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          PACKRAT_NATIVEWIND_UI_GITHUB_TOKEN: ${{ secrets.PACKRAT_NATIVEWIND_UI_GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Determine target environment
        id: env
        run: |
          # For workflow_dispatch, use the input value
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TARGET_ENV=${{ inputs.environment }}" >> $GITHUB_ENV
          # For push events, determine from branch
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "TARGET_ENV=prod" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=dev" >> $GITHUB_ENV
          fi

          echo "Targeting $TARGET_ENV environment"

      - name: Run migrations
        env:
          NEON_DATABASE_URL: ${{ env.TARGET_ENV == 'prod' && secrets.NEON_PROD_DATABASE_URL || secrets.NEON_DEV_DATABASE_URL }}
        run: bun run packages/api/migrate.ts

      # Feature controls are data, not schema, so they are a seed script rather
      # than a migration (see docs/feature-gating.md). Running them here anyway
      # means a new feature's flag and access rows land automatically instead of
      # depending on someone remembering to run the seed by hand.
      #
      # Runs after migrations because it writes to feature_flags/feature_access,
      # which a migration may have just created or altered. Idempotent — every
      # insert is ON CONFLICT DO NOTHING, so a re-run never clobbers a row an
      # operator changed.
      - name: Seed feature controls
        env:
          NEON_DATABASE_URL: ${{ env.TARGET_ENV == 'prod' && secrets.NEON_PROD_DATABASE_URL || secrets.NEON_DEV_DATABASE_URL }}
        run: bun run packages/api/src/db/seed-feature-controls.ts

