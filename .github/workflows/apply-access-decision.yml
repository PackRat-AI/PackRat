name: Apply Access Decision

# Writes a merged PR's access decision into the feature_access table.
#
# The entitlement database stays the single source of truth for who can use
# what; this is the controlled input that writes to it. Nothing about access
# lives in the repo, and clients keep reading the database exactly as before.
#
# Runs only on merge. access-decision.yml is the gate that blocks an incomplete
# decision from getting here.

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply access decision
    # Only actually-merged PRs. `closed` also fires when a PR is abandoned, and
    # a discarded feature must not be written to the entitlement table.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Write PR body to a file
        # Via the environment and a file rather than shell interpolation: a PR
        # description is untrusted input.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Apply the decision
        env:
          PACKRAT_API_URL: ${{ secrets.PACKRAT_API_URL }}
          PACKRAT_ADMIN_USERNAME: ${{ secrets.PACKRAT_ADMIN_USERNAME }}
          PACKRAT_ADMIN_PASSWORD: ${{ secrets.PACKRAT_ADMIN_PASSWORD }}
        run: |
          bun scripts/lint/apply-access-decision.ts \
            --body-file "$RUNNER_TEMP/pr-body.md"
