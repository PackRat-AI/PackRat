name: Access Decision

# Blocks merge until a human has decided who gets a new user-facing feature.
# Ordinary work — fixes, refactors, polish — passes without anyone touching it.
# See docs/access-decisions.md for the contract and the reasoning.
#
# This is a separate workflow from checks.yml on purpose: `edited` must be a
# trigger, because the way a human clears this gate is by editing the PR
# description. A gate that only re-ran on a code push would leave the check red
# after the decision was made, and the obvious fix — pushing an empty commit —
# is exactly the friction this design is trying to avoid.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  access-decision:
    name: Access decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The detector diffs against the base branch, which needs real history
          # rather than the default single-commit fetch.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Write PR body to a file
        # Passed via the environment and a file rather than interpolated into a
        # shell command: a PR description is untrusted input, and inlining it
        # into `run:` would let its contents execute as shell.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Check for an access decision
        run: |
          bun scripts/lint/detect-access-decisions.ts \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
