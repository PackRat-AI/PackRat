[project]
name = "species-model"
version = "0.1.0"
description = "Builds the on-device species classifier shipped in the iOS app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coremltools>=8.3",
  "numpy<2.3",
  "open-clip-torch>=2.32",
  "pillow>=11",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "timm>=1.0.15",
  "torch==2.7.0",
  "torchvision==0.22.0",
]

[tool.uv]
package = false
